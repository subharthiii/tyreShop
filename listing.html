<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tyres — SKT Tyres</title>
    <meta name="description" content="SKT Tyres — Authorized Bridgestone and JK Tyre dealer in Tarakeswar, Hooghly. Genuine tyres for cars, SUVs and commercial vehicles. Call or visit us today.">
    <meta name="keywords" content="tyres, tyre shop, Bridgestone, JK Tyre, Tarakeswar, Hooghly, West Bengal, car tyres, truck tyres">
    <meta name="author" content="Shree Krishna Traders">

    <!-- Open Graph — makes it look good when shared on WhatsApp, Facebook -->
    <meta property="og:title" content="SKT Tyres — Shree Krishna Traders">
    <meta property="og:description" content="Authorized Bridgestone and JK Tyre dealer in Tarakeswar, Hooghly since 2019.">
    <meta property="og:image" content="images/hero-bg.jpg">
    <meta property="og:url" content="https://subharthiii.github.io/tyreShop">
    <meta property="og:type" content="website">
    <link rel="icon" href="images/SKT_logo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  </head>

  <body>
    <div class="page-wrapper">

      <!-- NAVBAR -->
      <header class="navbar">
        <div class="container">
          <a href="index.html" class="navbar__logo">
            <img src="images/SKT_logo.png" alt="SKT Tyres">
          </a>
          <nav class="navbar__links">
            <a href="index.html#brands">Brands</a>
            <a href="index.html#categories">Categories</a>
            <a href="index.html#about">About</a>
            <a href="index.html#contact">Contact</a>
          </nav>
          <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
            <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="1" x2="12" y2="3"/>
              <line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/>
              <line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
          </button>
              <button class="hamburger" id="hamburger">
              <span></span>
              <span></span>
              <span></span>
          </button>
        </div>
      </header>

      <!-- PAGE HEADER -->
      <section class="listing-hero">
        <div class="container">
          <p class="section__label">SKT Tyres</p>
          <h1 class="listing-hero__title">Tyre <span class="accent">Listings.</span></h1>
          <p class="listing-hero__sub">Browse our full catalogue. Visit the store or call us to place your order.</p>
        </div>
      </section>

      <!-- FILTERS + GRID -->
      <section class="listing">
        <div class="container listing__inner">

          <!-- FILTERS SIDEBAR -->
          <aside class="filters">
            <p class="filters__heading">Filter By</p>

            <div class="filter-group">
              <p class="filter-group__label">Brand</p>
              <label class="filter-option">
                <input type="checkbox" value="bs"> Bridgestone
              </label>
              <label class="filter-option">
                <input type="checkbox" value="jk"> JK Tyre
              </label>
            </div>

            <div class="filter-group">
              <p class="filter-group__label">Vehicle Type</p>
              <label class="filter-option">
                <input type="checkbox" value="cars"> Cars & SUVs
              </label>
              <label class="filter-option">
                <input type="checkbox" value="trucks"> Trucks & Commercial
              </label>
            </div>

            <div class="filter-group">
              <p class="filter-group__label">Size</p>
              <label class="filter-option"><input type="checkbox" value="165/80R14"> 165/80 R14</label>
              <label class="filter-option"><input type="checkbox" value="185/65R15"> 185/65 R15</label>
              <label class="filter-option"><input type="checkbox" value="195/65R15"> 195/65 R15</label>
              <label class="filter-option"><input type="checkbox" value="205/55R16"> 205/55 R16</label>
              <label class="filter-option"><input type="checkbox" value="215/60R17"> 215/60 R17</label>
              <label class="filter-option"><input type="checkbox" value="225/45R18"> 225/45 R18</label>
              <label class="filter-option"><input type="checkbox" value="750R16"> 750 R16</label>
              <label class="filter-option"><input type="checkbox" value="1000R20"> 1000 R20</label>
            </div>

            <button class="btn btn--outline" id="clearFilters">Clear Filters</button>
          </aside>

          <!-- TYRE GRID -->
          <div class="tyre-grid" id="tyreGrid">
            
          </div><!-- end tyre-grid -->

        </div>
      </section>

    </div>
    <script type="module" src="listing.js"></script>
  </body>
</html>
