<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — SKT Tyres</title>
    <link rel="icon" href="images/SKT_logo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  </head>

  <body>
    <div class="page-wrapper">

        <!-- LOGIN SCREEN -->
        <div class="login-screen" id="loginScreen">
          <div class="login-box">
            <img src="images/SKT_logo.png" alt="SKT Tyres" height="48">
            <h1 class="login-box__title">Admin Login</h1>
            <p class="login-box__sub">Only authorized staff can access this page.</p>

            <div class="login-form">
              <input type="email" id="emailInput" class="login-input" placeholder="Email address">
              <input type="password" id="passwordInput" class="login-input" placeholder="Password">
              <button class="btn btn--primary login-btn" id="loginBtn">Sign In</button>

              <div style="display:flex;align-items:center;gap:0.75rem;margin:0.25rem 0;">
                <hr style="flex:1;border-color:var(--color-border);">
                <span style="font-size:0.75rem;color:var(--color-gray);">or</span>
                <hr style="flex:1;border-color:var(--color-border);">
              </div>

              <button class="btn btn--outline login-btn" id="googleLoginBtn" style="display:flex;align-items:center;justify-content:center;gap:0.5rem;">
                <svg width="16" height="16" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                  <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                  <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                  <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Sign in with Google
              </button>

              <p class="login-error" id="loginError"></p>
            </div>
          </div>
        </div>

      <!-- ADMIN DASHBOARD — hidden until logged in -->
      <div class="admin-dashboard" id="adminDashboard" style="display:none;">

        <header class="admin-header">
          <div class="container">
            <img src="images/SKT_logo.png" alt="SKT Tyres" height="32">
            <p class="admin-header__title">Admin Panel</p>
            <button class="btn btn--outline" id="logoutBtn">Logout</button>
          </div>
        </header>

        <div class="container admin-body">
          <h2 class="section__title">Manage <span class="accent">Listings.</span></h2>
          <p style="color:var(--color-gray-lt);margin-bottom:2rem;font-size:0.9rem;">Add, edit or delete tyre listings below.</p>

          <!-- ADD TYRE FORM -->
          <div class="admin-form">
            <h3 class="admin-form__title">Add New Tyre</h3>
            <div class="admin-form__grid">
              <input type="text" class="login-input" id="f-brand" placeholder="Brand (e.g. Bridgestone)">
              <input type="text" class="login-input" id="f-brandKey" placeholder="Brand key (e.g. bridgestone)">
              <input type="text" class="login-input" id="f-model" placeholder="Model (e.g. Ecopia EP150)">
              <input type="text" class="login-input" id="f-size" placeholder="Size (e.g. 185/65 R15)">
              <input type="text" class="login-input" id="f-vehicle" placeholder="Vehicle (e.g. Cars & SUVs)">
              <input type="text" class="login-input" id="f-vehicleKey" placeholder="Vehicle key (e.g. cars)">
              <input type="text" class="login-input" id="f-price" placeholder="Price (e.g. ₹3800)">
              <input type="text" class="login-input" id="f-imageUrl" placeholder="Image URL (optional)">
            </div>
            <button class="btn btn--primary" id="addTyreBtn">Add Tyre</button>
            <p class="login-error" id="addError"></p>
          </div>

          <!-- LISTINGS TABLE -->
          <div class="admin-listings" id="adminListings">
            <p style="color:var(--color-gray-lt);">Loading listings...</p>
          </div>

        </div>
      </div>

    </div>
    <script type="module" src="admin.js"></script>
  </body>
</html>
